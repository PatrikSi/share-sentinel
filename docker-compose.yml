services:
  gateway:
    image: traefik:latest@sha256:9004e1cd1e33c5eb0b6ec02bc6cfda61fe9caca36751114b1c9c6662f01b264a
    environment:
      DOCKER_API_VERSION: "1.44"
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    depends_on:
      - api
      - ui

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: share_sentinel
      POSTGRES_USER: share_sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U share_sentinel -d share_sentinel"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniadata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  bootstrap:
    build: ./api
    command: ["sh", "-lc", "alembic upgrade head && python -m app.bootstrap"]
    environment:
      DATABASE_URL: postgresql+psycopg://share_sentinel:${POSTGRES_PASSWORD:-change-me}@db:5432/share_sentinel
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123456}
      TOKEN_PEPPER: ${TOKEN_PEPPER:-change-me-long-random-string}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me}
      S3_BUCKET: share-sentinel-artifacts
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: "no"

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://share_sentinel:${POSTGRES_PASSWORD:-change-me}@db:5432/share_sentinel
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me}
      S3_BUCKET: share-sentinel-artifacts
      JWT_SECRET: ${JWT_SECRET:-change-me-super-long-random-string}
      JWT_ISSUER: share-sentinel
      TOKEN_PEPPER: ${TOKEN_PEPPER:-change-me-long-random-string}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      API_ROOT_PATH: /api
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 10
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=(Host(`localhost`) || Host(`127.0.0.1`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.priority=100"
      - "traefik.http.routers.api.middlewares=api-strip-prefix"
      - "traefik.http.middlewares.api-strip-prefix.stripprefix.prefixes=/api"
      - "traefik.http.services.api.loadbalancer.server.port=8000"

  worker:
    build: ./worker
    environment:
      DATABASE_URL: postgresql+psycopg://share_sentinel:${POSTGRES_PASSWORD:-change-me}@db:5432/share_sentinel
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me}
      S3_BUCKET: share-sentinel-artifacts
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully

  ui:
    build:
      context: ./ui
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ui.rule=(Host(`localhost`) || Host(`127.0.0.1`)) && !PathPrefix(`/api`)"
      - "traefik.http.routers.ui.entrypoints=web"
      - "traefik.http.routers.ui.priority=1"
      - "traefik.http.services.ui.loadbalancer.server.port=3000"

volumes:
  pgdata:
  redisdata:
  miniadata:
