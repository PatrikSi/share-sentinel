services:
  gateway:
    image: traefik:v3.6.9
    environment:
      DOCKER_API_VERSION: "1.44"
    command:
      - "--global.checknewversion=false"
      - "--global.sendanonymoususage=false"
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.constraints=Label(`share-sentinel.stack`,`${SHARE_SENTINEL_STACK:-default}`)"
      - "--entrypoints.web.address=:80"
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_HTTP_PORT:-80}:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    depends_on:
      - api
      - ui

  db:
    image: postgres:16.14
    environment:
      POSTGRES_DB: share_sentinel
      POSTGRES_USER: share_sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U share_sentinel -d share_sentinel"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.9
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  bootstrap:
    image: ghcr.io/patriksi/share-sentinel-api:${SHARE_SENTINEL_IMAGE_TAG:-latest}
    pull_policy: always
    command: ["sh", "-lc", "alembic upgrade head && python -m app.bootstrap"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://share_sentinel:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/share_sentinel
      ARTIFACT_STORAGE_PATH: /artifacts
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
      PASSWORD_REQUIRE_LOWERCASE: ${PASSWORD_REQUIRE_LOWERCASE:-true}
      PASSWORD_REQUIRE_UPPERCASE: ${PASSWORD_REQUIRE_UPPERCASE:-true}
      PASSWORD_REQUIRE_NUMBER: ${PASSWORD_REQUIRE_NUMBER:-true}
      PASSWORD_REQUIRE_SPECIAL: ${PASSWORD_REQUIRE_SPECIAL:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in .env}
      TOKEN_PEPPER: ${TOKEN_PEPPER:?set TOKEN_PEPPER in .env}
    volumes:
      - artifacts:/artifacts
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: ghcr.io/patriksi/share-sentinel-api:${SHARE_SENTINEL_IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: ${APP_HOST:-localhost}
      DATABASE_URL: postgresql+psycopg://share_sentinel:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/share_sentinel
      REDIS_URL: redis://redis:6379/0
      ARTIFACT_STORAGE_PATH: /artifacts
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-share-sentinel}
      TOKEN_PEPPER: ${TOKEN_PEPPER:?set TOKEN_PEPPER in .env}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-14}
      REQUIRE_USER_FOR_API_TOKEN_CREATE: ${REQUIRE_USER_FOR_API_TOKEN_CREATE:-true}
      ALLOW_LEGACY_UNSCOPED_TOKENS: ${ALLOW_LEGACY_UNSCOPED_TOKENS:-false}
      DEFAULT_API_TOKEN_EXPIRY_DAYS: ${DEFAULT_API_TOKEN_EXPIRY_DAYS:-90}
      ALLOW_NEVER_EXPIRING_API_TOKENS: ${ALLOW_NEVER_EXPIRING_API_TOKENS:-false}
      API_TOKEN_LAST_USED_UPDATE_INTERVAL_SECONDS: ${API_TOKEN_LAST_USED_UPDATE_INTERVAL_SECONDS:-300}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-share_sentinel_session}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_COOKIE_PATH: ${AUTH_COOKIE_PATH:-/}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      AUTH_CSRF_COOKIE_NAME: ${AUTH_CSRF_COOKIE_NAME:-share_sentinel_csrf}
      AUTH_CSRF_HEADER_NAME: ${AUTH_CSRF_HEADER_NAME:-x-csrf-token}
      AUTH_REFRESH_COOKIE_NAME: ${AUTH_REFRESH_COOKIE_NAME:-share_sentinel_refresh}
      AUTH_REQUIRE_CSRF: ${AUTH_REQUIRE_CSRF:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      ALLOW_SELF_REGISTRATION: ${ALLOW_SELF_REGISTRATION:-false}
      API_ROOT_PATH: /api
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10737418240}
      UPLOAD_CHUNK_BYTES: ${UPLOAD_CHUNK_BYTES:-8388608}
      RATE_LIMIT_FAIL_OPEN: ${RATE_LIMIT_FAIL_OPEN:-false}
      REDIS_STREAM_RETRIES: ${REDIS_STREAM_RETRIES:-3}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
      PASSWORD_REQUIRE_LOWERCASE: ${PASSWORD_REQUIRE_LOWERCASE:-true}
      PASSWORD_REQUIRE_UPPERCASE: ${PASSWORD_REQUIRE_UPPERCASE:-true}
      PASSWORD_REQUIRE_NUMBER: ${PASSWORD_REQUIRE_NUMBER:-true}
      PASSWORD_REQUIRE_SPECIAL: ${PASSWORD_REQUIRE_SPECIAL:-false}
      AUTH_LOGIN_MAX_ATTEMPTS: ${AUTH_LOGIN_MAX_ATTEMPTS:-8}
      AUTH_LOGIN_WINDOW_SECONDS: ${AUTH_LOGIN_WINDOW_SECONDS:-300}
      AUTH_LOGIN_LOCKOUT_SECONDS: ${AUTH_LOGIN_LOCKOUT_SECONDS:-900}
      REDIS_STREAM_MAXLEN: ${REDIS_STREAM_MAXLEN:-250000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - artifacts:/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; request = urllib.request.Request('http://localhost:8000/healthz/ready', headers={'Host': os.environ.get('APP_HOST', 'localhost')}); urllib.request.urlopen(request, timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 10
    labels:
      - "share-sentinel.stack=${SHARE_SENTINEL_STACK:-default}"
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=(Host(`${APP_HOST:-localhost}`) || Host(`localhost`) || Host(`127.0.0.1`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.priority=100"
      - "traefik.http.routers.api.middlewares=api-strip-prefix"
      - "traefik.http.middlewares.api-strip-prefix.stripprefix.prefixes=/api"
      - "traefik.http.services.api.loadbalancer.server.port=8000"

  worker:
    image: ghcr.io/patriksi/share-sentinel-worker:${SHARE_SENTINEL_IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      DATABASE_URL: postgresql+psycopg://share_sentinel:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/share_sentinel
      REDIS_URL: redis://redis:6379/0
      ARTIFACT_STORAGE_PATH: /artifacts
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKER_HEARTBEAT_PATH: /tmp/share-sentinel-worker-heartbeat.json
      WORKER_HEALTH_TIMEOUT_SECONDS: ${WORKER_HEALTH_TIMEOUT_SECONDS:-45}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - artifacts:/artifacts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "worker.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ui:
    image: ghcr.io/patriksi/share-sentinel-ui:${SHARE_SENTINEL_IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      VITE_CSRF_COOKIE_NAME: ${VITE_CSRF_COOKIE_NAME:-share_sentinel_csrf}
      VITE_CSRF_HEADER_NAME: ${VITE_CSRF_HEADER_NAME:-x-csrf-token}
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    labels:
      - "share-sentinel.stack=${SHARE_SENTINEL_STACK:-default}"
      - "traefik.enable=true"
      - "traefik.http.routers.ui.rule=(Host(`${APP_HOST:-localhost}`) || Host(`localhost`) || Host(`127.0.0.1`)) && !PathPrefix(`/api`)"
      - "traefik.http.routers.ui.entrypoints=web"
      - "traefik.http.routers.ui.priority=1"
      - "traefik.http.services.ui.loadbalancer.server.port=3000"

  collector:
    image: ghcr.io/patriksi/share-sentinel-collector:${SHARE_SENTINEL_IMAGE_TAG:-latest}
    pull_policy: always
    profiles: ["tools"]
    environment:
      SHARE_SENTINEL_SMB_PASSWORD: ${SHARE_SENTINEL_SMB_PASSWORD:-}
      SHARE_SENTINEL_SMB_HASHES: ${SHARE_SENTINEL_SMB_HASHES:-}
      SHARE_SENTINEL_API_TOKEN: ${SHARE_SENTINEL_API_TOKEN:-}
    volumes:
      - collector_output:/data

volumes:
  pgdata:
  redisdata:
  artifacts:
  collector_output:
