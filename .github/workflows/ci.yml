name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Keep all main publications in one ordered lane so an older run can never
  # finish after a newer run and roll `latest` backward. PR work remains scoped.
  group: ${{ github.event_name == 'pull_request' && format('share-sentinel-pr-{0}', github.ref) || 'share-sentinel-main-publication' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-tests:
    name: ${{ matrix.component }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [api, worker, collector]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.component }}/requirements-dev.txt
      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: pip install -r requirements-dev.txt
      - name: Lint component
        run: ruff check "${{ matrix.component }}"
      - name: Lint repository scripts
        if: matrix.component == 'api'
        run: ruff check scripts
      - name: Validate shell tooling
        if: matrix.component == 'api'
        run: |
          bash -n bootstrap.sh scripts/*.sh
          ./scripts/doctor.sh --help >/dev/null
      - name: Validate release metadata
        if: matrix.component == 'api'
        run: python scripts/check-release.py
      - name: Run tests
        working-directory: ${{ matrix.component }}
        run: pytest -q -p no:cacheprovider
      - name: Validate tracked artifact fixture
        if: matrix.component == 'worker'
        run: |
          python scripts/validate-sample.py
          python scripts/validate-ndjson.py examples/sample-sharepoint-baseline.ndjson
          python scripts/validate-ndjson.py examples/sample-sharepoint-current.ndjson
      - name: Validate streaming capacity fixture tooling
        if: matrix.component == 'worker'
        run: |
          python scripts/generate-capacity-artifact.py \
            --output "${RUNNER_TEMP}/capacity.ndjson.gz" \
            --endpoints 2 \
            --shares-per-endpoint 3 \
            --items-per-share 100
          capacity_summary=$(python scripts/validate-ndjson.py --json "${RUNNER_TEMP}/capacity.ndjson.gz")
          jq -e '.records == 610 and .endpoints == 2 and .resources == 6 and .items == 600 and .errors == 0' \
            <<<"$capacity_summary" >/dev/null

  sharepoint-windows:
    name: SharePoint collector on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: collector/requirements-dev.txt
      - name: Install collector dependencies
        working-directory: collector
        run: pip install -r requirements-dev.txt
      - name: Lint SharePoint collector
        run: ruff check collector/share_sentinel_sharepoint.py collector/collector_entrypoint.py collector/sharepoint collector/tests/test_sharepoint_auth.py collector/tests/test_sharepoint_cli.py collector/tests/test_sharepoint_collection.py collector/tests/test_sharepoint_graph.py collector/tests/test_sharepoint_state.py collector/tests/test_collector_writer.py
      - name: Test Windows and SharePoint contracts
        run: pytest -q -p no:cacheprovider collector/tests/test_sharepoint_auth.py collector/tests/test_sharepoint_cli.py collector/tests/test_sharepoint_collection.py collector/tests/test_sharepoint_graph.py collector/tests/test_sharepoint_state.py collector/tests/test_collector_writer.py
      - name: Verify SharePoint command
        run: python collector/share_sentinel_sharepoint.py --help

  ui:
    name: UI build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install locked dependencies
        working-directory: ui
        run: npm ci
      - name: Audit dependencies
        working-directory: ui
        run: npm audit --audit-level=high
      - name: Test UI behavior
        working-directory: ui
        run: npm test
      - name: Typecheck and build
        working-directory: ui
        run: npm run build

  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit API dependencies
        run: pip-audit -r api/requirements-dev.txt
      - name: Audit worker dependencies
        run: pip-audit -r worker/requirements-dev.txt
      - name: Audit collector dependencies
        run: pip-audit -r collector/requirements-dev.txt

  containers:
    name: Compose, containers, and live smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [python-tests, sharepoint-windows, ui, python-audit]
    env:
      POSTGRES_PASSWORD: CiDatabasePassword123
      JWT_SECRET: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
      TOKEN_PEPPER: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: CiAdminPassword123
      SHARE_SENTINEL_SMOKE_PASSWORD: CiAdminPassword123
      SHARE_SENTINEL_STACK: ci-${{ github.run_id }}
      GATEWAY_BIND_ADDRESS: 127.0.0.1
      GATEWAY_HTTP_PORT: 18080
      APP_HOST: localhost
      AUTH_COOKIE_SECURE: "false"
      TRUSTED_HOSTS: localhost,127.0.0.1
      TRUSTED_PROXY_CIDRS: 172.16.0.0/12
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate generated environment modes
        run: |
          ./bootstrap.sh --development --output "${RUNNER_TEMP}/share-sentinel-dev.env" >/dev/null
          ./bootstrap.sh --production sentinel.example.com --image-tag v1.2.0 --output "${RUNNER_TEMP}/share-sentinel-prod.env" >/dev/null
          test "$(stat -c '%a' "${RUNNER_TEMP}/share-sentinel-dev.env")" = "600"
          test "$(stat -c '%a' "${RUNNER_TEMP}/share-sentinel-prod.env")" = "600"
          docker compose --env-file "${RUNNER_TEMP}/share-sentinel-dev.env" config --quiet
          docker compose --env-file "${RUNNER_TEMP}/share-sentinel-prod.env" config --quiet
      - name: Prepare build environment
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile tools config --quiet
          POSTGRES_PASSWORD='reserved:@/?#[]%value' docker compose -f docker-compose.yml config --format json > "${RUNNER_TEMP}/compose-reserved-password.json"
          jq -e '
            [.services.bootstrap, .services.api, .services.worker]
            | all(.environment.PGPASSWORD == "reserved:@/?#[]%value")
              and all(.environment.DATABASE_URL == "postgresql+psycopg://share_sentinel@db:5432/share_sentinel")
          ' "${RUNNER_TEMP}/compose-reserved-password.json" >/dev/null
      - name: Build all application images from source
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile tools build
      - name: Verify application image contracts
        run: |
          docker run --rm --entrypoint sh share-sentinel-api:dev -c 'test "$(id -u)" = 10001 && touch /artifacts/write-check && rm /artifacts/write-check'
          docker run --rm --entrypoint sh share-sentinel-worker:dev -c 'test "$(id -u)" = 10001 && touch /artifacts/write-check && rm /artifacts/write-check'
          docker run --rm --entrypoint sh share-sentinel-collector:dev -c 'test "$(id -u)" = 10001 && command -v showmount && touch /data/write-check && rm /data/write-check'
          docker run --rm --entrypoint python share-sentinel-collector:dev -c 'import tempfile; assert tempfile.gettempdir() == "/data"'
          docker run --rm share-sentinel-collector:dev --help >/dev/null
          docker run --rm share-sentinel-collector:dev sharepoint --help >/dev/null
          docker run --rm -e VITE_API_BASE_URL=/runtime-api -e VITE_CSRF_COOKIE_NAME=runtime_csrf -e VITE_CSRF_HEADER_NAME=x-runtime-csrf --entrypoint sh share-sentinel-ui:dev -c 'test "$(id -u)" = 10001 && test "$(id -g)" = 10001 && /docker-entrypoint.d/40-runtime-config.sh && grep -q '\''apiBase:"/runtime-api"'\'' /usr/share/nginx/html/runtime-config.js'
          docker run --rm --entrypoint nginx share-sentinel-ui:dev -t
      - name: Scan application images
        run: |
          set -euo pipefail
          for image in share-sentinel-api:dev share-sentinel-worker:dev share-sentinel-ui:dev share-sentinel-collector:dev; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v share-sentinel-trivy-cache:/root/.cache \
              aquasec/trivy:0.72.0 image \
              --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL --scanners vuln "$image"
          done
      - name: Start development stack
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --wait --wait-timeout 120
      - name: Verify routes and complete ingest lifecycle
        run: |
          ./scripts/smoke-routes.sh http://localhost:18080
          ./scripts/smoke-ingest.sh http://localhost:18080 admin@example.com
          ./scripts/smoke-sharepoint-ingest.sh http://localhost:18080 admin@example.com
      - name: Stop development stack
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v --remove-orphans
      - name: Start production-style stack
        env:
          APP_ENV: production
          APP_HOST: sentinel.example.com
          SHARE_SENTINEL_STACK: ci-production-${{ github.run_id }}
          GATEWAY_HTTP_PORT: 18081
          AUTH_COOKIE_SECURE: "true"
          TRUSTED_HOSTS: sentinel.example.com
          CORS_ORIGINS: https://sentinel.example.com
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --wait --wait-timeout 120
      - name: Verify production security posture
        run: ./scripts/smoke-production.sh http://localhost:18081 sentinel.example.com admin@example.com
      - name: Clean up Compose resources
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v --remove-orphans

  publish-images:
    name: Publish ${{ matrix.component }} image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: containers
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: ./api
          - component: worker
            context: ./worker
          - component: ui
            context: ./ui
          - component: collector
            context: ./collector
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ghcr.io/patriksi/share-sentinel-${{ matrix.component }}:candidate-sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: mode=max
          sbom: true

  promote-images:
    name: Promote verified images to latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify-candidate-images
    outputs:
      latest_promoted: ${{ steps.main_head.outputs.current }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote immutable commit images
        run: |
          set -euo pipefail
          tag_state() {
            local reference="$1"
            local error_file
            local state
            error_file=$(mktemp)
            if docker buildx imagetools inspect "$reference" >/dev/null 2>"$error_file"; then
              state='present'
            elif grep -Eiq '(manifest unknown|name unknown|not found)' "$error_file"; then
              state='missing'
            else
              echo "Registry inspection failed for $reference" >&2
              cat "$error_file" >&2
              rm -f "$error_file"
              return 2
            fi
            rm -f "$error_file"
            printf '%s\n' "$state"
          }
          for component in api worker ui collector; do
            repository="ghcr.io/patriksi/share-sentinel-${component}"
            candidate="${repository}:candidate-sha-${GITHUB_SHA}"
            immutable="${repository}:sha-${GITHUB_SHA}"
            immutable_state=$(tag_state "$immutable")
            if [[ "$immutable_state" == "missing" ]]; then
              docker buildx imagetools create --tag "$immutable" "$candidate"
            fi
            docker pull "$candidate"
            docker pull "$immutable"
            candidate_image_id=$(docker image inspect "$candidate" --format '{{.Id}}')
            immutable_image_id=$(docker image inspect "$immutable" --format '{{.Id}}')
            immutable_revision=$(docker image inspect "$immutable" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
            if [[ "$candidate_image_id" != "$immutable_image_id" || "$immutable_revision" != "$GITHUB_SHA" ]]; then
              echo "Refusing to overwrite immutable tag $immutable with a different runnable image or revision" >&2
              exit 1
            fi
          done
      - name: Check current main head
        id: main_head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [[ "$current_sha" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo "Skipping latest promotion because main now points to $current_sha"
          fi
      - name: Promote current main images to latest
        if: steps.main_head.outputs.current == 'true'
        run: |
          set -euo pipefail
          for component in api worker ui collector; do
            docker buildx imagetools create \
              --tag "ghcr.io/patriksi/share-sentinel-${component}:latest" \
              "ghcr.io/patriksi/share-sentinel-${component}:sha-${GITHUB_SHA}"
          done

  verify-candidate-images:
    name: Verify published image candidates
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: publish-images
    permissions:
      contents: read
      packages: read
    env:
      ADMIN_PASSWORD: CiAdminPassword123
      SHARE_SENTINEL_SMOKE_PASSWORD: CiAdminPassword123
      SHARE_SENTINEL_STACK: ci-published-${{ github.run_id }}
      GATEWAY_HTTP_PORT: 18082
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate production configuration
        run: ./bootstrap.sh --production sentinel.example.com --image-tag "candidate-sha-${GITHUB_SHA}" --output "${RUNNER_TEMP}/share-sentinel-published.env" >/dev/null
      - name: Pull and verify published image candidates
        run: |
          docker compose --env-file "${RUNNER_TEMP}/share-sentinel-published.env" --profile tools pull
          for component in api worker ui collector; do
            revision=$(docker image inspect \
              "ghcr.io/patriksi/share-sentinel-${component}:candidate-sha-${GITHUB_SHA}" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
            test "$revision" = "$GITHUB_SHA"
          done
      - name: Verify published collector contract
        run: |
          image="ghcr.io/patriksi/share-sentinel-collector:candidate-sha-${GITHUB_SHA}"
          docker run --rm --entrypoint sh "$image" -c 'test "$(id -u)" = 10001 && touch /data/write-check && rm /data/write-check'
          docker run --rm "$image" --help >/dev/null
          docker run --rm "$image" sharepoint --help >/dev/null
      - name: Scan published image candidates
        run: |
          set -euo pipefail
          for component in api worker ui collector; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v share-sentinel-trivy-cache:/root/.cache \
              aquasec/trivy:0.72.0 image \
              --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL --scanners vuln \
              "ghcr.io/patriksi/share-sentinel-${component}:candidate-sha-${GITHUB_SHA}"
          done
      - name: Start production stack from published images
        run: docker compose --env-file "${RUNNER_TEMP}/share-sentinel-published.env" up -d --wait --wait-timeout 180
      - name: Verify published production stack
        run: ./scripts/smoke-production.sh http://localhost:18082 sentinel.example.com admin@example.com
      - name: Clean up Compose resources
        if: always()
        run: docker compose --env-file "${RUNNER_TEMP}/share-sentinel-published.env" down -v --remove-orphans

  verify-promoted-images:
    name: Verify latest promotion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: promote-images
    if: ${{ needs['promote-images'].outputs.latest_promoted == 'true' }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify promoted image identities
        run: |
          set -euo pipefail
          for component in api worker ui collector; do
            repository="ghcr.io/patriksi/share-sentinel-${component}"
            docker pull "${repository}:sha-${GITHUB_SHA}"
            docker pull "${repository}:latest"
            test "$(docker image inspect "${repository}:sha-${GITHUB_SHA}" --format '{{.Id}}')" = \
              "$(docker image inspect "${repository}:latest" --format '{{.Id}}')"
            test "$(docker image inspect "${repository}:latest" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = \
              "$GITHUB_SHA"
          done
