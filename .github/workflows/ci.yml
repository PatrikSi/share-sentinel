name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: ${{ matrix.component }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [api, worker, collector]
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.component }}/requirements-dev.txt
      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: ${{ matrix.component }}
        run: pytest -q -p no:cacheprovider
      - name: Validate tracked artifact fixture
        if: matrix.component == 'worker'
        run: python scripts/validate-sample.py

  ui:
    name: UI build and audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install locked dependencies
        working-directory: ui
        run: npm ci
      - name: Audit dependencies
        working-directory: ui
        run: npm audit --audit-level=high
      - name: Typecheck and build
        working-directory: ui
        run: npm run build

  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit API dependencies
        run: pip-audit -r api/requirements-dev.txt
      - name: Audit worker dependencies
        run: pip-audit -r worker/requirements-dev.txt
      - name: Audit collector dependencies
        run: pip-audit -r collector/requirements-dev.txt

  containers:
    name: Compose and container builds
    runs-on: ubuntu-latest
    needs: [python-tests, ui, python-audit]
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Prepare build environment
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build production images
        run: docker compose build
