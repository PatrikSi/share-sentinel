name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish source release
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements-dev.txt
            worker/requirements-dev.txt
            collector/requirements-dev.txt
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependency auditor
        run: pip install pip-audit
      - name: Verify release metadata
        run: python scripts/check-release.py --tag "${GITHUB_REF_NAME}"
      - name: Test API
        working-directory: api
        run: pip install -r requirements-dev.txt && pytest -q -p no:cacheprovider
      - name: Test worker
        working-directory: worker
        run: pip install -r requirements-dev.txt && pytest -q -p no:cacheprovider
      - name: Test collector
        working-directory: collector
        run: pip install -r requirements-dev.txt && pytest -q -p no:cacheprovider
      - name: Validate sample artifact
        run: python scripts/validate-sample.py
      - name: Audit Python dependencies
        run: |
          pip-audit -r api/requirements-dev.txt
          pip-audit -r worker/requirements-dev.txt
          pip-audit -r collector/requirements-dev.txt
      - name: Build and audit UI
        working-directory: ui
        run: npm ci && npm audit --audit-level=high && npm run build
      - name: Build production images
        run: cp .env.example .env && docker compose config --quiet && docker compose build
      - name: Create source archives and checksums
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="share-sentinel-${GITHUB_REF_NAME}/" -o "dist/share-sentinel-${GITHUB_REF_NAME}.tar.gz" HEAD
          git archive --format=zip --prefix="share-sentinel-${GITHUB_REF_NAME}/" -o "dist/share-sentinel-${GITHUB_REF_NAME}.zip" HEAD
          cd dist
          sha256sum ./* > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "Share Sentinel ${GITHUB_REF_NAME}"
