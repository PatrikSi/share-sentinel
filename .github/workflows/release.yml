name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ReleaseDatabasePassword123
      JWT_SECRET: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
      TOKEN_PEPPER: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: ReleaseAdminPassword123
      SHARE_SENTINEL_SMOKE_PASSWORD: ReleaseAdminPassword123
      SHARE_SENTINEL_STACK: release-${{ github.run_id }}
      GATEWAY_BIND_ADDRESS: 127.0.0.1
      GATEWAY_HTTP_PORT: 18080
      APP_HOST: localhost
      AUTH_COOKIE_SECURE: "false"
      TRUSTED_HOSTS: localhost,127.0.0.1
      TRUSTED_PROXY_CIDRS: 172.16.0.0/12
    steps:
      - name: Check out tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Validate generated environment modes
        run: |
          ./bootstrap.sh --development --output "${RUNNER_TEMP}/share-sentinel-dev.env" >/dev/null
          ./bootstrap.sh --production sentinel.example.com --image-tag "${GITHUB_REF_NAME}" --output "${RUNNER_TEMP}/share-sentinel-prod.env" >/dev/null
          test "$(stat -c '%a' "${RUNNER_TEMP}/share-sentinel-dev.env")" = "600"
          test "$(stat -c '%a' "${RUNNER_TEMP}/share-sentinel-prod.env")" = "600"
          docker compose --env-file "${RUNNER_TEMP}/share-sentinel-dev.env" config --quiet
          docker compose --env-file "${RUNNER_TEMP}/share-sentinel-prod.env" config --quiet
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements-dev.txt
            worker/requirements-dev.txt
            collector/requirements-dev.txt
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependency auditor
        run: pip install pip-audit
      - name: Verify release metadata
        run: python scripts/check-release.py --tag "${GITHUB_REF_NAME}"
      - name: Test API
        working-directory: api
        run: pip install -r requirements-dev.txt && pytest -q -p no:cacheprovider
      - name: Test worker
        working-directory: worker
        run: pip install -r requirements-dev.txt && pytest -q -p no:cacheprovider
      - name: Test collector
        working-directory: collector
        run: pip install -r requirements-dev.txt && pytest -q -p no:cacheprovider
      - name: Validate sample artifact
        run: python scripts/validate-sample.py
      - name: Audit Python dependencies
        run: |
          pip-audit -r api/requirements-dev.txt
          pip-audit -r worker/requirements-dev.txt
          pip-audit -r collector/requirements-dev.txt
      - name: Build and audit UI
        working-directory: ui
        run: npm ci && npm audit --audit-level=high && npm run build
      - name: Build all application images from source
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile tools config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile tools build
      - name: Verify application image contracts
        run: |
          docker run --rm --entrypoint sh share-sentinel-api:dev -c 'test "$(id -u)" = 10001 && touch /artifacts/write-check && rm /artifacts/write-check'
          docker run --rm --entrypoint sh share-sentinel-worker:dev -c 'test "$(id -u)" = 10001 && touch /artifacts/write-check && rm /artifacts/write-check'
          docker run --rm --entrypoint sh share-sentinel-collector:dev -c 'test "$(id -u)" = 10001 && command -v showmount && touch /data/write-check && rm /data/write-check'
          docker run --rm share-sentinel-collector:dev --help >/dev/null
          docker run --rm -e VITE_API_BASE_URL=/runtime-api -e VITE_CSRF_COOKIE_NAME=runtime_csrf -e VITE_CSRF_HEADER_NAME=x-runtime-csrf --entrypoint sh share-sentinel-ui:dev -c '/docker-entrypoint.d/40-runtime-config.sh && grep -q '\''apiBase:"/runtime-api"'\'' /usr/share/nginx/html/runtime-config.js'
          docker run --rm --entrypoint nginx share-sentinel-ui:dev -t
      - name: Scan application images
        run: |
          set -euo pipefail
          for image in share-sentinel-api:dev share-sentinel-worker:dev share-sentinel-ui:dev share-sentinel-collector:dev; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v share-sentinel-trivy-cache:/root/.cache \
              aquasec/trivy:0.72.0 image \
              --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL --scanners vuln "$image"
          done
      - name: Start development stack
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
      - name: Verify routes and complete ingest lifecycle
        run: |
          ./scripts/smoke-routes.sh http://localhost:18080
          ./scripts/smoke-ingest.sh http://localhost:18080 admin@example.com
      - name: Stop development stack
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v --remove-orphans
      - name: Start production-style stack
        env:
          APP_ENV: production
          APP_HOST: sentinel.example.com
          SHARE_SENTINEL_STACK: release-production-${{ github.run_id }}
          GATEWAY_HTTP_PORT: 18081
          AUTH_COOKIE_SECURE: "true"
          TRUSTED_HOSTS: sentinel.example.com
          CORS_ORIGINS: https://sentinel.example.com
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
      - name: Verify production security posture
        run: ./scripts/smoke-production.sh http://localhost:18081 sentinel.example.com admin@example.com
      - name: Clean up Compose resources
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v --remove-orphans

  publish-images:
    name: Publish ${{ matrix.component }} image
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: ./api
          - component: worker
            context: ./worker
          - component: ui
            context: ./ui
          - component: collector
            context: ./collector
    steps:
      - name: Check out tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ghcr.io/patriksi/share-sentinel-${{ matrix.component }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: mode=max
          sbom: true

  promote-images:
    name: Promote verified release images
    runs-on: ubuntu-latest
    needs: publish-images
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote complete release image set
        run: |
          for component in api worker ui collector; do
            docker buildx imagetools create \
              --tag "ghcr.io/patriksi/share-sentinel-${component}:${GITHUB_REF_NAME}" \
              --tag "ghcr.io/patriksi/share-sentinel-${component}:latest" \
              "ghcr.io/patriksi/share-sentinel-${component}:sha-${GITHUB_SHA}"
          done

  publish-release:
    name: Publish source release
    runs-on: ubuntu-latest
    needs: [verify, promote-images]
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Create source archives and checksums
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="share-sentinel-${GITHUB_REF_NAME}/" -o "dist/share-sentinel-${GITHUB_REF_NAME}.tar.gz" HEAD
          git archive --format=zip --prefix="share-sentinel-${GITHUB_REF_NAME}/" -o "dist/share-sentinel-${GITHUB_REF_NAME}.zip" HEAD
          cd dist
          sha256sum ./* > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "Share Sentinel ${GITHUB_REF_NAME}"
